<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLACE ORACLE 本番ログイン確認</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./google-auth-client.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.7}
    .card{border:1px solid #ddd;border-radius:12px;padding:20px}
    button{padding:10px 16px;margin:4px 2px}
    .checkout{margin-top:18px;padding-top:18px;border-top:1px solid #ddd}
    pre{background:#f6f6f6;padding:12px;white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <h1>本番ログイン確認</h1>
  <div class="card">
    <div id="googleBtn"></div>
    <p><button id="meBtn">/auth/me を確認</button> <button id="logoutBtn">ログアウト</button></p>

    <p>本番のログイン状態だけを確認します。ここから購入・課金はできません。</p>

    <pre id="out">Google Identity Services の読込待ちです…</pre>
  </div>
<script>
const GOOGLE_CLIENT_ID = '559524100347-3hiiar1bmlcqbtb4q0adlahgojjfslj5.apps.googleusercontent.com';
const out = document.getElementById('out');
const show = (v) => out.textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
const showUser = (me) => show({ authenticated: me?.authenticated === true, membership: me?.membership || 'none' });

function initGoogle() {
  if (!window.google || !google.accounts || !google.accounts.id) {
    setTimeout(initGoogle, 250);
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: async (response) => {
      try {
        await PlaceOracleAuth.exchangeGoogleCredential(response.credential);
        showUser(await PlaceOracleAuth.currentUser());
      } catch (e) {
        show({error:e.message,status:e.status,});
      }
    }
  });
  google.accounts.id.renderButton(document.getElementById('googleBtn'), {
    theme: 'outline',
    size: 'large',
    text: 'signin_with'
  });
  show('Googleログインボタンを準備しました');
}

document.getElementById('meBtn').onclick = async () => {
  try { showUser(await PlaceOracleAuth.currentUser()); }
  catch (e) { show({error:e.message,status:e.status,}); }
};

document.getElementById('logoutBtn').onclick = async () => {
  try { await PlaceOracleAuth.logout(); show({ok:true,logged_out:true}); }
  catch (e) { show({error:e.message,status:e.status,}); }
};

initGoogle();
</script>
</body>
</html>
