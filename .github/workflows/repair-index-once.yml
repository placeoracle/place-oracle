name: One-time index repair

on:
  push:
    branches: [audit/commercial-readiness-20261003]
    paths:
      - '.github/workflows/repair-index-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/commercial-readiness-20261003
      - name: Restore known-good index and apply first-party STORY policy
        run: |
          git show 27dc929dca64f714b02559a97dc97a30cae22238:index.html > index.html
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('index.html','utf8');
          const start=s.indexOf('const storyPool=[');
          const end=s.indexOf('  ];',start);
          if(start<0||end<0) throw new Error('storyPool not found');
          let before=s.slice(0,start), pool=s.slice(start,end), after=s.slice(end);
          for(let i=1;i<=50;i++){
            const nn=String(i).padStart(2,'0');
            const re=new RegExp('\\{id:'+i+',([\\s\\S]*?)(?=\\n\\s*\\{id:'+(i+1)+'|$)');
            const m=pool.match(re);
            if(!m) throw new Error('story '+i+' not found');
            let row=m[0]
              .replace(/img:"[^"]*"/,'img:"fallback_'+nn+'.svg"')
              .replace(/source:"[^"]*"/,'source:"PLACE ORACLE"')
              .replace(/sourceUrl:"[^"]*"/,'sourceUrl:""');
            pool=pool.replace(m[0],row);
          }
          s=before+pool+after;
          if(s.includes('Warning: truncated output')) throw new Error('truncation warning remains');
          if(!/^\s*<!doctype html>/i.test(s)||!/<\/html>\s*$/i.test(s)) throw new Error('HTML boundary invalid');
          const po=(pool.match(/source:"PLACE ORACLE"/g)||[]).length;
          const ext=(pool.match(/source:"Pexels"/g)||[]).length;
          if(po!==50||ext!==0) throw new Error('STORY policy mismatch: '+po+' first-party, '+ext+' external');
          fs.writeFileSync('index.html',s);
          console.log('validated bytes',Buffer.byteLength(s),'first-party stories',po);
          NODE
      - name: Commit repaired index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore complete index and preserve first-party stories"
          git push origin HEAD:audit/commercial-readiness-20261003
