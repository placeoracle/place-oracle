# Final product QA
name: Story gallery QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'PHOTO_QA.html'
      - 'membership-widget.js'
      - 'story_*.jpg'
      - 'fallback_*.svg'
      - '.github/workflows/story-gallery-qa.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'index.html'
      - 'PHOTO_QA.html'
      - 'membership-widget.js'
      - 'story_*.jpg'
      - 'fallback_*.svg'
      - '.github/workflows/story-gallery-qa.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check STORY, PHOTO_QA, and first-party fallback files
        run: node .github/scripts/verify-story-gallery.mjs
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Check mobile gallery and selected frame
        run: |
          python3 -m http.server 4173 --directory . > /tmp/place-oracle-http.log 2>&1 &
          node .github/scripts/check-mobile-story-gallery.mjs
      - name: Check prefecture and municipality selectors
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', err => errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 120000 });
            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(300);
            if (errors.length) throw new Error('Page errors before form open: ' + errors.join(' | '));
            await page.click('#heroStart');
            await page.locator('#formSection').waitFor({ state: 'visible', timeout: 10000 });
            await page.locator('#formSection').screenshot({ path: 'qa-artifacts/form-mobile.png' });
            const prefCount = await page.locator('#birthPrefecture option').count();
            if (prefCount !== 48) throw new Error('Expected 47 prefectures plus placeholder, got ' + prefCount);
            await page.selectOption('#birthYear','1980');
            await page.selectOption('#birthMonth','1');
            await page.selectOption('#birthDay','10');
            await page.selectOption('#birthPrefecture',{label:'静岡県'});
            const cityCount = await page.locator('#birthMunicipality option').count();
            if (cityCount < 2) throw new Error('Municipality options did not populate for 静岡県');
            const disabled = await page.locator('#birthMunicipality').isDisabled();
            if (disabled) throw new Error('Municipality selector remained disabled after prefecture selection');
            await page.selectOption('#birthMunicipality',{label:'掛川市'});
            await page.check('input[name="scene"][value="sea"]');
            await page.click('#read');
            await page.locator('#themeBlock').waitFor({ state: 'visible', timeout: 10000 });
            await page.click('#read');
            await page.locator('#reading').waitFor({ state: 'visible', timeout: 10000 });
            const skyVisible = await page.locator('#visibleSkySection').isVisible();
            if (!skyVisible) throw new Error('Visible-sky section did not render in reading flow');
            const skyTitle = (await page.locator('#skyTitleText').textContent() || '').trim();
            const skyStory = (await page.locator('#skyStoryText').textContent() || '').trim();
            if (!skyTitle || !skyStory) throw new Error('Visible-sky content was empty');
            const bodyText = await page.locator('body').innerText();
            if (/\bundefined\b/i.test(bodyText)) throw new Error('Visible undefined text found in completed reading flow');
            if (bodyText.trimEnd().endsWith('\\n')) throw new Error('Literal \\n is visible at the end of the page');
            await page.locator('#visibleSkySection').screenshot({ path: 'qa-artifacts/visible-sky-mobile.png' });
            if (errors.length) throw new Error('Page errors in full reading flow: ' + errors.join(' | '));
            await browser.close();
          })();
          NODE
      - name: Verify deployed production flow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRODUCTION_URL: https://placeoracle.github.io/place-oracle/
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await chromium.launch({ headless: true });
            let lastError = '';
            for (let attempt = 1; attempt <= 24; attempt++) {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              const errors = [];
              page.on('pageerror', err => errors.push(err.message));
              try {
                await page.goto(process.env.PRODUCTION_URL + '?release=2026-10-06-final', { waitUntil: 'networkidle', timeout: 60000 });
                const release = await page.locator('meta[name="place-oracle-release"]').getAttribute('content');
                if (release !== '2026-10-06-final') throw new Error('Production release marker not updated yet: ' + release);
                await page.evaluate(() => localStorage.clear());
                await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
                await page.click('#heroStart');
                await page.locator('#formSection').waitFor({ state: 'visible', timeout: 10000 });
                if (await page.locator('#birthPrefecture option').count() !== 48) throw new Error('Production prefecture selector incomplete');
                await page.selectOption('#birthYear','1980');
                await page.selectOption('#birthMonth','1');
                await page.selectOption('#birthDay','10');
                await page.selectOption('#birthPrefecture',{label:'静岡県'});
                await page.selectOption('#birthMunicipality',{label:'掛川市'});
                await page.check('input[name="scene"][value="sea"]');
                await page.click('#read');
                await page.locator('#themeBlock').waitFor({ state: 'visible', timeout: 10000 });
                await page.click('#read');
                await page.locator('#reading').waitFor({ state: 'visible', timeout: 10000 });
                const skyTitle = (await page.locator('#skyTitleText').textContent() || '').trim();
                const skyStory = (await page.locator('#skyStoryText').textContent() || '').trim();
                const bodyText = await page.locator('body').innerText();
                if (!skyTitle || !skyStory) throw new Error('Production visible-sky content empty');
                if (/\bundefined\b/i.test(bodyText)) throw new Error('Production contains visible undefined text');
                if (bodyText.trimEnd().endsWith('\\n')) throw new Error('Production contains literal \\n');
                if (errors.length) throw new Error('Production page errors: ' + errors.join(' | '));
                console.log(JSON.stringify({ attempt, release, skyTitle, result: 'production-pass' }));
                await page.close();
                await browser.close();
                process.exit(0);
              } catch (err) {
                lastError = err.message;
                await page.close();
                if (attempt < 24) await sleep(10000);
              }
            }
            await browser.close();
            throw new Error('Production did not pass after retries: ' + lastError);
          })();
          NODE
      - name: Capture full PHOTO_QA contact sheet
        if: always()
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1200 } });
            const hero = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await hero.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 120000 });
            await hero.screenshot({ path: 'qa-artifacts/hero-mobile.png', fullPage: false });
            await hero.close();
            await page.goto('http://127.0.0.1:4173/PHOTO_QA.html', { waitUntil: 'networkidle', timeout: 120000 });
            await page.screenshot({ path: 'qa-artifacts/photo-qa-full.png', fullPage: true });
            for (const id of [1,6,11,16,21,26,31]) {
              const card = page.locator('.card[data-id="' + id + '"]');
              await card.scrollIntoViewIfNeeded();
              const box = await card.boundingBox();
              await page.screenshot({ path: 'qa-artifacts/audit-' + id + '.png', clip: { x: 0, y: Math.max(0, box.y), width: 1600, height: 3600 } });
            }
            await page.locator('.card[data-id="36"]').scrollIntoViewIfNeeded();
            await page.waitForFunction(() => [36,37,38,39,40].every(id => { const img=document.querySelector('.card[data-id="'+id+'"] img'); return img && img.complete && img.naturalWidth > 0; }), null, { timeout: 120000 });
            for (const id of [36,41,46]) {
              const card = page.locator('.card[data-id="' + id + '"]');
              await card.scrollIntoViewIfNeeded();
              const box = await card.boundingBox();
              await page.screenshot({ path: 'qa-artifacts/photo-qa-' + id + '-batch.png', clip: { x: 0, y: Math.max(0, box.y), width: 1600, height: 3600 } });
            }
            await browser.close();
          })();
          NODE
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-gallery-mobile-check
          path: |
            qa-artifacts/story-gallery-mobile.png
            qa-artifacts/hero-mobile.png
            qa-artifacts/form-mobile.png
            qa-artifacts/visible-sky-mobile.png
            qa-artifacts/photo-qa-full.png
            qa-artifacts/audit-*.png
            qa-artifacts/photo-qa-36-batch.png
            qa-artifacts/photo-qa-41-batch.png
            qa-artifacts/photo-qa-46-batch.png
          if-no-files-found: warn
