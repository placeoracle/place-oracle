# Final product QA
name: Story gallery QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'PHOTO_QA.html'
      - 'membership-widget.js'
      - 'sky-chart.js'
      - 'sky-chart-data.js'
      - 'SKY_POINTS_SOURCES.csv'
      - 'story_*.jpg'
      - 'fallback_*.svg'
      - '.github/workflows/story-gallery-qa.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'index.html'
      - 'PHOTO_QA.html'
      - 'membership-widget.js'
      - 'sky-chart.js'
      - 'sky-chart-data.js'
      - 'SKY_POINTS_SOURCES.csv'
      - 'story_*.jpg'
      - 'fallback_*.svg'
      - '.github/workflows/story-gallery-qa.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check STORY, PHOTO_QA, and first-party fallback files
        run: node .github/scripts/verify-story-gallery.mjs
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Check mobile gallery and selected frame
        run: |
          python3 -m http.server 4173 --directory . > /tmp/place-oracle-http.log 2>&1 &
          node .github/scripts/check-mobile-story-gallery.mjs
      - name: Check prefecture and municipality selectors
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', err => errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 120000 });
            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(300);
            if (errors.length) throw new Error('Page errors before form open: ' + errors.join(' | '));
            await page.click('#heroStart');
            await page.locator('#formSection').waitFor({ state: 'visible', timeout: 10000 });
            await page.locator('#formSection').screenshot({ path: 'qa-artifacts/form-mobile.png' });
            const prefCount = await page.locator('#birthPrefecture option').count();
            if (prefCount !== 48) throw new Error('Expected 47 prefectures plus placeholder, got ' + prefCount);
            await page.selectOption('#birthYear','1969');
            await page.selectOption('#birthMonth','2');
            await page.selectOption('#birthDay','19');
            await page.selectOption('#birthPrefecture',{label:'静岡県'});
            const cityCount = await page.locator('#birthMunicipality option').count();
            if (cityCount < 2) throw new Error('Municipality options did not populate for 静岡県');
            const disabled = await page.locator('#birthMunicipality').isDisabled();
            if (disabled) throw new Error('Municipality selector remained disabled after prefecture selection');
            await page.selectOption('#birthMunicipality',{label:'掛川市'});
            await page.check('input[name="scene"][value="sea"]');
            await page.click('#read');
            await page.locator('#themeBlock').waitFor({ state: 'visible', timeout: 10000 });
            await page.click('#read');
            await page.locator('#reading').waitFor({ state: 'visible', timeout: 10000 });
            const skyVisible = await page.locator('#visibleSkySection').isVisible();
            if (!skyVisible) throw new Error('Visible-sky section did not render in reading flow');
            const skyTitle = (await page.locator('#skyTitleText').textContent() || '').trim();
            const skyStory = (await page.locator('#skyStoryText').textContent() || '').trim();
            if (!skyTitle || !skyStory) throw new Error('Visible-sky content was empty');
            const bodyText = await page.locator('body').innerText();
            if (/\bundefined\b/i.test(bodyText)) throw new Error('Visible undefined text found in completed reading flow');
            if (bodyText.trimEnd().endsWith('\\n')) throw new Error('Literal \\n is visible at the end of the page');
            await page.locator('#visibleSkySection').screenshot({ path: 'qa-artifacts/visible-sky-mobile.png' });
            if (errors.length) throw new Error('Page errors in full reading flow: ' + errors.join(' | '));
            await browser.close();
          })();
          NODE
      - name: Check recovery from stale browser data
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', err => errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 120000 });
            await page.evaluate(() => {
              localStorage.setItem('place_oracle_v5_map', JSON.stringify([null, 'broken', {bad:true}, {date:'2025-01-01', placeId:null}]));
              localStorage.setItem('place_oracle_v5_profile', JSON.stringify({
                birth:'1969-02-19',
                birthPlace:{prefecture:'静岡県', municipality:'掛川市', code:'222135'},
                stars:{},
                scene:'sea',
                theme:''
              }));
            });
            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.click('#heroStart');
            await page.locator('#formSection').waitFor({ state: 'visible', timeout: 10000 });
            await page.check('input[name="scene"][value="sea"]');
            await page.click('#read');
            await page.locator('#themeBlock').waitFor({ state: 'visible', timeout: 10000 });
            const errorText = (await page.locator('#formError').textContent() || '').trim();
            if (errorText) throw new Error('Stale browser data still causes form error: ' + errorText);
            await page.click('#read');
            await page.locator('#reading').waitFor({ state: 'visible', timeout: 10000 });
            if (errors.length) throw new Error('Page errors after stale-data recovery: ' + errors.join(' | '));
            await browser.close();
          })();
          NODE
      - name: Check returning-user result flow
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', err => errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 120000 });
            await page.evaluate(() => {
              localStorage.setItem('place_oracle_v5_profile', JSON.stringify({
                birth:'1969-02-19',
                birthPlace:{prefecture:'静岡県', municipality:'掛川市', code:'222135'},
                currentPlace:{prefecture:'静岡県', municipality:'掛川市', code:'222135'},
                stars:{h:4,g:3,day:{index:44,label:'戊申'}},
                scene:'distance',
                theme:'',
                firstSeen:'2026-10-05',
                lastChoiceDate:'2026-10-05'
              }));
              localStorage.setItem('place_oracle_v5_map', JSON.stringify([]));
            });
            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.click('#heroStart');
            await page.locator('#formSection').waitFor({ state: 'visible', timeout: 10000 });
            await page.check('input[name="scene"][value="distance"]');
            await page.click('#read');
            await page.locator('#themeBlock').waitFor({ state: 'visible', timeout: 10000 });
            const firstError = (await page.locator('#formError').textContent() || '').trim();
            if (firstError) throw new Error('Returning user failed before reading: ' + firstError);
            await page.click('#read');
            await page.locator('#reading').waitFor({ state: 'visible', timeout: 10000 });
            const finalError = (await page.locator('#formError').textContent() || '').trim();
            if (finalError) throw new Error('Returning user failed to render reading: ' + finalError);
            if (errors.length) throw new Error('Returning-user page errors: ' + errors.join(' | '));
            await browser.close();
          })();
          NODE
      - name: Check desktop journey composition
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 120000 });
            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.click('#heroStart');
            await page.locator('#formSection').waitFor({ state: 'visible', timeout: 10000 });
            const journeyVisible = await page.locator('.form-journey').isVisible();
            if (!journeyVisible) throw new Error('Desktop journey panel is not visible');
            const columns = await page.locator('.form-inner').evaluate(el => getComputedStyle(el).gridTemplateColumns);
            if (!columns || columns.split(' ').length < 2) throw new Error('Desktop form is not using the two-column editorial layout');
            if (await page.locator('#currentLocationDetails').count()) throw new Error('Removed current-location task is still present');
            await page.selectOption('#birthYear','1969');
            await page.selectOption('#birthMonth','2');
            await page.selectOption('#birthDay','19');
            await page.selectOption('#birthPrefecture',{label:'静岡県'});
            await page.selectOption('#birthMunicipality',{label:'掛川市'});
            await page.check('input[name="scene"][value="distance"]');
            await page.waitForTimeout(180);
            const journeyTitle = (await page.locator('#formJourneyTitle').textContent() || '').trim();
            if (journeyTitle !== '夕暮れの遠景') throw new Error('Scene choice did not update the journey panel: ' + journeyTitle);
            await page.click('#read');
            await page.locator('#themeBlock').waitFor({ state: 'visible', timeout: 10000 });
            const placeTitle = (await page.locator('#formJourneyTitle').textContent() || '').trim();
            if (!placeTitle || placeTitle === '夕暮れの遠景') throw new Error('Discovered PLACE did not replace the scene in the journey panel');
            await page.click('#read');
            await page.locator('#reading').waitFor({ state: 'visible', timeout: 10000 });
            const readingColumns = await page.locator('#reading').evaluate(el => getComputedStyle(el).gridTemplateColumns);
            if (!readingColumns || readingColumns.split(' ').length < 2) throw new Error('Desktop reading is not using the editorial two-column opening');
            await browser.close();
          })();
          NODE
      - name: Check desktop title balance
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1142, height: 900 } });
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 120000 });
            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.click('#heroStart');
            await page.selectOption('#birthYear','1969');
            await page.selectOption('#birthMonth','2');
            await page.selectOption('#birthDay','19');
            await page.selectOption('#birthPrefecture',{label:'静岡県'});
            await page.selectOption('#birthMunicipality',{label:'掛川市'});
            await page.check('input[name="scene"][value="distance"]');
            await page.click('#read');
            await page.locator('#themeBlock').waitFor({ state: 'visible', timeout: 10000 });
            const title = page.locator('#formTitle');
            const html = await title.innerHTML();
            if (!html.includes('今日、<br>') || !html.includes('あなたに重なる場所')) throw new Error('Desktop title composition is not the intended two-line copy: ' + html);
            const nowrap = page.locator('#formTitle .form-title-nowrap');
            const box = await nowrap.boundingBox();
            const parent = await title.boundingBox();
            if (!box || !parent) throw new Error('Title layout boxes unavailable');
            if (box.width > parent.width + 1) throw new Error('Second title line overflows the available column');
            const lineHeight = parseFloat(await title.evaluate(el => getComputedStyle(el).lineHeight));
            const fontSize = parseFloat(await title.evaluate(el => getComputedStyle(el).fontSize));
            if (fontSize > 45 || lineHeight/fontSize > 1.4) throw new Error('Desktop title typography is too large or too loose');
            await browser.close();
          })();
          NODE
      - name: Check full PLACE catalog balance
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1200, height: 900 } });
            await page.goto('http://127.0.0.1:4173/index.html?qa=1', { waitUntil: 'networkidle', timeout: 120000 });
            const report = await page.evaluate(() => window.__PLACE_ORACLE_QA__?.freshBalance());
            if (!report) throw new Error('PLACE selection QA hook is unavailable');
            if (report.catalog < 100) throw new Error('Full PLACE catalog is not active: ' + report.catalog);
            for (const [scene,count] of Object.entries(report.counts)) {
              if (count < 30) throw new Error('Scene pool too small for '+scene+': '+count);
              if (report.unique[scene] !== count) throw new Error('Some eligible PLACE records are unreachable for '+scene+': '+JSON.stringify(report));
              if (report.spread[scene].max - report.spread[scene].min > 1) throw new Error('Fresh selection is biased for '+scene+': '+JSON.stringify(report.spread[scene]));
            }
            if (report.thingScenes.length > 2) throw new Error('Thingvellir is over-classified: '+report.thingScenes);
            await browser.close();
            console.log(JSON.stringify(report));
          })();
          NODE
      - name: Check calculated visible-sky chart
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const errors = [];
            page.on('pageerror', err => errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 120000 });

            const coverage = await page.evaluate(() => {
              if (!window.PO_SKY_CHART || !window.PO_SKY_DATA) throw new Error('Sky chart runtime is unavailable');
              const date='2026-10-06';
              const missing=PO_PLACE_CATALOG.filter(place => !PO_SKY_CHART.chartSpec(String(place.id),date,21)).map(place=>String(place.id));
              const y=PO_SKY_CHART.chartSpec('yakushima',date,21);
              const polaris=PO_SKY_CHART.position(37.9529,89.2642,y);
              const t=PO_SKY_CHART.chartSpec('tasmania',date,21);
              const southPolaris=PO_SKY_CHART.position(37.9529,89.2642,t);
              return {
                catalog:PO_PLACE_CATALOG.length,
                coords:Object.keys(PO_SKY_DATA.coords||{}).length,
                stars:(PO_SKY_DATA.stars||[]).length,
                lines:(PO_SKY_DATA.lines||[]).length,
                missing,
                yakushimaPolaris:polaris.alt,
                tasmaniaPolaris:southPolaris.alt
              };
            });
            if (coverage.catalog < 100 || coverage.missing.length) throw new Error('Some PLACE results do not have a calculable sky chart: '+JSON.stringify(coverage));
            if (coverage.coords < coverage.catalog || coverage.stars < 100 || coverage.lines < 20) throw new Error('Astronomy dataset is incomplete: '+JSON.stringify(coverage));
            if (coverage.yakushimaPolaris < 27 || coverage.yakushimaPolaris > 34) throw new Error('Altitude calculation failed for Polaris at Yakushima: '+coverage.yakushimaPolaris);
            if (coverage.tasmaniaPolaris > 0) throw new Error('Polaris should be below the horizon from Tasmania: '+coverage.tasmaniaPolaris);

            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.click('#heroStart');
            await page.selectOption('#birthYear','1969');
            await page.selectOption('#birthMonth','2');
            await page.selectOption('#birthDay','19');
            await page.selectOption('#birthPrefecture',{label:'静岡県'});
            await page.selectOption('#birthMunicipality',{label:'掛川市'});
            await page.check('input[name="scene"][value="sea"]');
            await page.click('#read');
            await page.locator('#themeBlock').waitFor({ state:'visible', timeout:10000 });
            await page.click('#read');
            await page.locator('#reading').waitFor({ state:'visible', timeout:10000 });
            await page.locator('#observedSky').waitFor({ state:'visible', timeout:10000 });
            const placeName=(await page.locator('#placeName').textContent()||'').trim();
            const meta=(await page.locator('#skyChartMeta').innerText()||'').trim();
            if (!placeName || !/緯度/.test(meta) || !/経度/.test(meta)) throw new Error('Calculated chart metadata is incomplete: '+meta);

            const checksum = async () => page.locator('#skyChartCanvas').evaluate(canvas => {
              const ctx=canvas.getContext('2d');
              const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
              let sum=0; for(let i=0;i<data.length;i+=101) sum=(sum+data[i]+data[i+1]+data[i+2]+data[i+3])>>>0;
              return sum;
            });
            const at21=await checksum();
            if (!at21) throw new Error('Sky chart canvas is blank');
            await page.locator('#skyTimeRange').evaluate(el => {el.value='18';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForTimeout(120);
            const at18=await checksum();
            if (at18===at21) throw new Error('Changing local time did not change the calculated sky chart');

            await page.click('#skyChartEnlarge');
            await page.locator('#skyZoomDialog').waitFor({ state:'visible', timeout:5000 });
            const zoomChecksum=await page.locator('#skyZoomCanvas').evaluate(canvas => {
              const ctx=canvas.getContext('2d');
              const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
              let sum=0; for(let i=0;i<data.length;i+=137) sum=(sum+data[i]+data[i+1]+data[i+2]+data[i+3])>>>0;
              return sum;
            });
            if (!zoomChecksum) throw new Error('Enlarged sky chart canvas is blank');
            await page.click('#skyZoomClose');
            if (errors.length) throw new Error('Sky chart page errors: '+errors.join(' | '));
            console.log(JSON.stringify({placeName,coverage,at21,at18,zoomChecksum,result:'observed-sky-pass'}));
            await browser.close();
          })();
          NODE
      - name: Verify deployed production flow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRODUCTION_URL: https://placeoracle.github.io/place-oracle/
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await chromium.launch({ headless: true });
            let lastError = '';
            for (let attempt = 1; attempt <= 24; attempt++) {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              const errors = [];
              page.on('pageerror', err => errors.push(err.message));
              try {
                await page.goto(process.env.PRODUCTION_URL + '?release=2026-10-06-observed-sky&qa=1', { waitUntil: 'networkidle', timeout: 60000 });
                const release = await page.locator('meta[name="place-oracle-release"]').getAttribute('content');
                if (release !== '2026-10-06-observed-sky') throw new Error('Production release marker not updated yet: ' + release);
                await page.evaluate(() => localStorage.clear());
                await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
                await page.click('#heroStart');
                await page.locator('#formSection').waitFor({ state: 'visible', timeout: 10000 });
                if (await page.locator('#birthPrefecture option').count() !== 48) throw new Error('Production prefecture selector incomplete');
                await page.selectOption('#birthYear','1969');
                await page.selectOption('#birthMonth','2');
                await page.selectOption('#birthDay','19');
                await page.selectOption('#birthPrefecture',{label:'静岡県'});
                await page.selectOption('#birthMunicipality',{label:'掛川市'});
                await page.check('input[name="scene"][value="sea"]');
                await page.click('#read');
                await page.locator('#themeBlock').waitFor({ state: 'visible', timeout: 10000 });
                await page.click('#read');
                await page.locator('#reading').waitFor({ state: 'visible', timeout: 10000 });
                const skyTitle = (await page.locator('#skyTitleText').textContent() || '').trim();
                const observedSkyVisible = await page.locator('#observedSky').isVisible();
                if (!observedSkyVisible) throw new Error('Production observed-sky chart is not visible');
                const chartMeta = (await page.locator('#skyChartMeta').innerText() || '').trim();
                if (!/緯度/.test(chartMeta) || !/経度/.test(chartMeta)) throw new Error('Production sky-chart metadata is missing coordinates: ' + chartMeta);
                const chartPixels = await page.locator('#skyChartCanvas').evaluate(canvas => {
                  const data=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
                  let sum=0; for(let i=0;i<data.length;i+=127) sum=(sum+data[i]+data[i+1]+data[i+2]+data[i+3])>>>0;
                  return sum;
                });
                if (!chartPixels) throw new Error('Production observed-sky chart canvas is blank');
                const skyStory = (await page.locator('#skyStoryText').textContent() || '').trim();
                const fairness = await page.evaluate(() => window.__PLACE_ORACLE_QA__?.freshBalance(1070));
                if (!fairness) throw new Error('Production PLACE selection QA hook unavailable');
                if (fairness.catalog < 100 || Object.values(fairness.counts).some(n=>n<30)) throw new Error('Production full catalog inactive: ' + JSON.stringify(fairness));
                if (Object.entries(fairness.unique).some(([scene,n])=>n!==fairness.counts[scene])) throw new Error('Production has unreachable PLACE records: ' + JSON.stringify(fairness));
                const bodyText = await page.locator('body').innerText();
                if (!skyTitle || !skyStory) throw new Error('Production visible-sky content empty');
                if (/\bundefined\b/i.test(bodyText)) throw new Error('Production contains visible undefined text');
                if (bodyText.trimEnd().endsWith('\\n')) throw new Error('Production contains literal \\n');
                if (errors.length) throw new Error('Production page errors: ' + errors.join(' | '));
                console.log(JSON.stringify({ attempt, release, skyTitle, result: 'production-pass' }));
                await page.close();
                await browser.close();
                process.exit(0);
              } catch (err) {
                lastError = err.message;
                await page.close();
                if (attempt < 24) await sleep(10000);
              }
            }
            await browser.close();
            throw new Error('Production did not pass after retries: ' + lastError);
          })();
          NODE
      - name: Verify deployed stale-data recovery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRODUCTION_URL: https://placeoracle.github.io/place-oracle/
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await chromium.launch({ headless: true });
            let lastError = '';
            for (let attempt = 1; attempt <= 24; attempt++) {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              const errors = [];
              page.on('pageerror', err => errors.push(err.message));
              try {
                await page.goto(process.env.PRODUCTION_URL + '?stale=2026-10-06-observed-sky', { waitUntil: 'networkidle', timeout: 60000 });
                const release = await page.locator('meta[name="place-oracle-release"]').getAttribute('content');
                if (release !== '2026-10-06-observed-sky') throw new Error('Production release marker not updated yet: ' + release);
                await page.evaluate(() => {
                  localStorage.setItem('place_oracle_v5_map', JSON.stringify([null,'broken',{bad:true},{date:'2025-01-01',placeId:null}]));
                  localStorage.setItem('place_oracle_v5_profile', JSON.stringify({
                    birth:'1969-02-19',
                    birthPlace:{prefecture:'静岡県', municipality:'掛川市', code:'222135'},
                    stars:{},
                    scene:'sea',
                    theme:''
                  }));
                });
                await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
                await page.click('#heroStart');
                await page.locator('#formSection').waitFor({ state: 'visible', timeout: 10000 });
                await page.check('input[name="scene"][value="sea"]');
                await page.click('#read');
                await page.locator('#themeBlock').waitFor({ state: 'visible', timeout: 10000 });
                const formError = (await page.locator('#formError').textContent() || '').trim();
                if (formError) throw new Error('Production stale-data recovery error: ' + formError);
                if (errors.length) throw new Error('Production stale-data page errors: ' + errors.join(' | '));
                console.log(JSON.stringify({ attempt, release, result: 'production-stale-data-pass' }));
                await page.close();
                await browser.close();
                process.exit(0);
              } catch (err) {
                lastError = err.message;
                await page.close();
                if (attempt < 24) await sleep(10000);
              }
            }
            await browser.close();
            throw new Error('Production stale-data recovery did not pass after retries: ' + lastError);
          })();
