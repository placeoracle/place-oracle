<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLACE ORACLE - メンバーシップUI確認</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./google-auth-client.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f2633}
    #site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #memberBtn{
      position:fixed;z-index:10000;top:18px;right:220px;
      border:1px solid rgba(255,255,255,.55);border-radius:999px;
      padding:10px 17px;background:rgba(17,44,59,.72);color:#fff;
      font:600 14px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
      backdrop-filter:blur(8px);cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.16)
    }
    #memberBtn.active{border-color:#d6b45d;color:#fff7dc}
    #shade{display:none;position:fixed;z-index:10001;inset:0;background:rgba(7,25,35,.56);padding:24px;box-sizing:border-box}
    #shade.open{display:grid;place-items:center}
    #panel{
      width:min(520px,100%);max-height:min(720px,calc(100vh - 48px));overflow:auto;
      border-radius:18px;background:#f7f3e8;color:#15313d;padding:28px;box-sizing:border-box;
      box-shadow:0 24px 70px rgba(0,0,0,.35);font-family:system-ui,-apple-system,"Segoe UI",sans-serif
    }
    .head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    .eyebrow{font-size:12px;letter-spacing:.18em;color:#9a771c;font-weight:700}
    h2{font-family:serif;font-size:26px;line-height:1.3;margin:6px 0 10px}
    .close{border:0;background:transparent;font-size:28px;cursor:pointer;color:#15313d}
    .status{padding:14px 16px;background:#fff;border:1px solid #ded8c9;border-radius:12px;margin:16px 0}
    .actions{display:grid;gap:10px;margin-top:18px}
    .buy,.secondary{border-radius:999px;padding:13px 18px;font-weight:700;cursor:pointer}
    .buy{border:0;background:#174e64;color:#fff}
    .secondary{border:1px solid #174e64;background:transparent;color:#174e64}
    [hidden]{display:none!important}\n    .small{font-size:12px;color:#65747a;line-height:1.6}
    #googleBtn{margin:18px 0}
    #result{white-space:pre-wrap;word-break:break-word;font-size:12px;margin-top:12px;color:#7a2f22}
    @media(max-width:700px){
      #memberBtn{top:62px;right:14px;padding:9px 13px;font-size:13px}
      #shade{padding:12px}
      #panel{padding:22px}
    }
  </style>
</head>
<body>
  <iframe id="site" src="./index.html" title="PLACE ORACLE"></iframe>
  <button id="memberBtn" type="button">ログイン</button>

  <div id="shade" role="dialog" aria-modal="true" aria-labelledby="memberTitle">
    <section id="panel">
      <div class="head">
        <div>
          <div class="eyebrow">MEMBERSHIP</div>
          <h2 id="memberTitle">PLACE ORACLE<br>メンバーシップ</h2>
        </div>
        <button class="close" id="closeBtn" aria-label="閉じる">×</button>
      </div>
      <div id="status" class="status">状態を確認しています…</div>
      <div id="googleBtn"></div>
      <div id="purchase" class="actions" hidden>
        <button class="buy" data-plan="monthly">月額480円で利用する</button>
        <button class="secondary" data-plan="yearly">年額4,800円で利用する</button>
        <div class="small"></div>
      </div>
      <div id="memberActive" hidden>
        <p>ご利用中のメンバーシップがあります。</p>
      </div>
      <button id="logoutBtn" class="secondary" hidden>ログアウト</button>
      <div id="result"></div>
    </section>
  </div>

<script>
const GOOGLE_CLIENT_ID='559524100347-3hiiar1bmlcqbtb4q0adlahgojjfslj5.apps.googleusercontent.com';
const btn=document.getElementById('memberBtn');
const shade=document.getElementById('shade');
const statusEl=document.getElementById('status');
const googleBtn=document.getElementById('googleBtn');
const purchase=document.getElementById('purchase');
const memberActive=document.getElementById('memberActive');
const logoutBtn=document.getElementById('logoutBtn');
const result=document.getElementById('result');

function renderState(me){
  const authed=!!me?.authenticated;
  const active=authed && me.membership==='active';
  btn.textContent=active?'会員':'ログイン';
  btn.classList.toggle('active',active);
  googleBtn.style.display=authed?'none':'block';
  purchase.hidden=!authed || active;
  memberActive.hidden=!active;
  logoutBtn.hidden=!authed;
  if(!authed) statusEl.textContent='Googleでログインすると、メンバーシップを確認できます。';
  else if(active) statusEl.textContent='メンバーシップは有効です。';
  else statusEl.textContent='ログイン済み。現在、有効なメンバーシップはありません。';
}

async function refresh(){
  try{ renderState(await PlaceOracleAuth.currentUser()); }
  catch(e){ renderState({authenticated:false}); result.textContent=e.message||String(e); }
}

function initGoogle(){
  if(!window.google?.accounts?.id){setTimeout(initGoogle,250);return;}
  google.accounts.id.initialize({
    client_id:GOOGLE_CLIENT_ID,
    callback:async r=>{
      try{
        await PlaceOracleAuth.exchangeGoogleCredential(r.credential);
        result.textContent='';
        await refresh();
      }catch(e){result.textContent=e.message||String(e);}
    }
  });
  google.accounts.id.renderButton(googleBtn,{theme:'outline',size:'large',text:'signin_with'});
}

btn.onclick=()=>{shade.classList.add('open');refresh();};
document.getElementById('closeBtn').onclick=()=>shade.classList.remove('open');
shade.addEventListener('click',e=>{if(e.target===shade)shade.classList.remove('open')});
logoutBtn.onclick=async()=>{await PlaceOracleAuth.logout();await refresh();};
document.querySelectorAll('[data-plan]').forEach(el=>{
  el.onclick=async()=>{
    try{
      result.textContent='Stripe Checkoutを準備しています…';
      const data=await PlaceOracleAuth.createCheckout(el.dataset.plan);
      location.href=data.url;
    }catch(e){result.textContent=e.message||String(e);}
  };
});
initGoogle();
refresh();
</script>
</body>
</html>
